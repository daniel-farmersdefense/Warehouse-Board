<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Warehouse Board — Daniel Rodriguez</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f4f1;--surface:#ffffff;--border:rgba(0,0,0,0.1);--border-mid:rgba(0,0,0,0.18);
  --text:#1a1a18;--text-muted:#6b6b67;--text-hint:#9a9a96;
  --radius-md:8px;--radius-lg:14px;
  --green:#1D9E75;--green-bg:#EAF3DE;--green-text:#27500A;
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#633806;
  --red:#E24B4A;--red-bg:#FCEBEB;--red-text:#A32D2D;
  --blue:#378ADD;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --purple:#7F77DD;--purple-bg:#EEEDFE;--purple-text:#3C3489;
  --gray-bg:#F1EFE8;--gray-text:#444441;
  --teal-bg:#E1F5EE;--teal-text:#085041;
  --coral-bg:#FAECE7;--coral-text:#712B13;
  --pink-bg:#FDE8F0;--pink-text:#7B1040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:#1a1a18;color:#f5f4f1;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:18px;font-weight:600;letter-spacing:-0.02em;color:#f5f4f1}
.topbar-sub{font-size:12px;color:rgba(255,255,255,0.45)}
.topbar-date{font-size:12px;color:rgba(255,255,255,0.55);background:rgba(255,255,255,0.08);border-radius:var(--radius-md);padding:5px 12px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#888;display:inline-block;margin-right:6px;transition:background 0.3s}
.sync-dot.live{background:#1D9E75}
.sync-status{font-size:11px;color:rgba(255,255,255,0.5);display:flex;align-items:center}
.container{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.full{grid-column:1/-1}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:0.5px solid var(--border);flex-wrap:wrap}
.ch i{font-size:18px}
.ch h2{font-size:14px;font-weight:600;color:var(--text);flex:1;letter-spacing:-0.01em}
.badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green-text)}
.b-amber{background:var(--amber-bg);color:var(--amber-text)}
.b-red{background:var(--red-bg);color:var(--red-text)}
.b-blue{background:var(--blue-bg);color:var(--blue-text)}
.b-purple{background:var(--purple-bg);color:var(--purple-text)}
.b-gray{background:var(--gray-bg);color:var(--gray-text)}
.b-teal{background:var(--teal-bg);color:var(--teal-text)}
.safety-box{background:var(--amber-bg);border-left:3px solid var(--amber);padding:14px 16px;margin-bottom:12px}
.safety-box .s-title{font-size:15px;font-weight:600;color:#412402;margin-bottom:6px}
.safety-box .s-detail{font-size:13px;color:var(--amber-text);line-height:1.65}
.ack-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
.ack-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);cursor:pointer;background:var(--bg);font-size:13px;color:var(--text);font-family:inherit;transition:all 0.15s}
.ack-btn.acked{background:var(--green-bg);border-color:#97C459;color:var(--green-text)}
.ack-btn i{font-size:16px}
.ack-summary{font-size:12px;color:var(--text-muted);margin-top:10px}
.metric-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.met{background:var(--bg);border-radius:var(--radius-md);padding:12px 14px}
.met .lbl{font-size:11px;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
.met .val{font-size:24px;font-weight:600;color:var(--text);letter-spacing:-0.02em}
.goal-bar-wrap{margin:12px 0 6px}
.goal-bar-track{width:100%;height:24px;background:var(--bg);border-radius:var(--radius-md);overflow:hidden}
.goal-bar-fill{height:100%;border-radius:var(--radius-md);transition:width 0.5s;display:flex;align-items:center;justify-content:flex-end;padding-right:10px}
.goal-bar-pct{font-size:12px;font-weight:500;color:#fff}
.goal-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:5px}
.goal-edit{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.goal-edit input{font-size:13px;padding:6px 8px;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);background:var(--bg);color:var(--text);width:90px}
.perf-hdr,.perf-row{display:grid;grid-template-columns:34px 1fr 62px 62px 62px;gap:8px;align-items:center}
.perf-hdr{padding:0 0 8px;border-bottom:0.5px solid var(--border-mid);margin-bottom:2px}
.perf-row{padding:8px 0;border-bottom:0.5px solid var(--border)}
.perf-row:last-child{border-bottom:none}
.col-lbl{font-size:11px;font-weight:600;color:var(--text-muted);text-align:center;text-transform:uppercase;letter-spacing:0.04em}
.perf-input{font-size:13px;padding:5px 4px;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);background:var(--bg);color:var(--text);width:100%;text-align:center}
.perf-input:focus{outline:none;border-color:var(--blue)}
.row-total{font-size:14px;font-weight:600;color:var(--text);text-align:center}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.av0{background:var(--blue-bg);color:var(--blue-text)}
.av1{background:var(--teal-bg);color:var(--teal-text)}
.av2{background:var(--purple-bg);color:var(--purple-text)}
.av3{background:var(--amber-bg);color:var(--amber-text)}
.av4{background:var(--coral-bg);color:var(--coral-text)}
.av5{background:var(--pink-bg);color:var(--pink-text)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border)}
.row:last-child{border-bottom:none}
.txt{font-size:14px;color:var(--text)}
.txt-sm{font-size:13px;color:var(--text-muted)}
.txt-xs{font-size:12px;color:var(--text-muted)}
.bold{font-weight:600}
.tog{font-size:12px;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-top:12px;padding:5px 0;user-select:none;border-bottom:1px dashed var(--border-mid)}
.tog:hover{color:var(--text)}
.add-form{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.add-form input,.add-form select,.add-form textarea{font-size:13px;padding:8px 10px;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);background:var(--bg);color:var(--text);width:100%;font-family:inherit}
.add-form input:focus,.add-form select:focus,.add-form textarea:focus{outline:none;border-color:var(--blue)}
.add-form textarea{resize:vertical;min-height:60px}
.btn{font-size:13px;font-weight:500;padding:8px 16px;border:0.5px solid var(--border-mid);border-radius:var(--radius-md);background:var(--text);color:var(--bg);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:opacity 0.15s;font-family:inherit}
.btn:hover{opacity:0.85}
.btn-ghost{background:transparent;color:var(--text)}
.btn-ghost:hover{background:var(--bg);opacity:1}
.btn-sm{font-size:12px;padding:5px 10px}
.hidden{display:none}
.del{background:none;border:none;cursor:pointer;color:var(--text-hint);font-size:14px;padding:3px 5px;border-radius:5px;flex-shrink:0}
.del:hover{color:var(--red-text);background:var(--red-bg)}
.kudo-item,.ann-item,.workload-item,.sugg-item,.priority-item,.bday-item{padding:10px 0;border-bottom:0.5px solid var(--border)}
.kudo-item:last-child,.ann-item:last-child,.workload-item:last-child,.sugg-item:last-child,.priority-item:last-child,.bday-item:last-child{border-bottom:none}
.status-pill{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;cursor:pointer;border:none;font-family:inherit}
.s-pending{background:var(--amber-bg);color:var(--amber-text)}
.s-done{background:var(--green-bg);color:var(--green-text)}
.s-inprog{background:var(--amber-bg);color:var(--amber-text)}
.s-resolved{background:var(--green-bg);color:var(--green-text)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cleanup-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.cleanup-row:last-child{border-bottom:none}
.cleanup-task{display:flex;align-items:center;gap:10px}
.cleanup-icon{width:32px;height:32px;border-radius:var(--radius-md);background:var(--teal-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cleanup-icon i{font-size:16px;color:var(--teal-text)}
.break-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.break-card{background:var(--bg);border-radius:var(--radius-md);padding:14px}
.break-card .shift-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.break-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border)}
.break-row:last-child{border-bottom:none}
.break-label{font-size:12px;color:var(--text-muted)}
.break-time{font-size:13px;font-weight:600;background:var(--blue-bg);color:var(--blue-text);padding:2px 10px;border-radius:20px}
.weather-main{display:flex;align-items:center;gap:20px;padding:10px 0 14px}
.weather-icon{font-size:52px;line-height:1}
.weather-temp{font-size:48px;font-weight:700;letter-spacing:-0.04em;color:var(--text);line-height:1}
.weather-desc{font-size:14px;color:var(--text-muted);margin-top:4px;text-transform:capitalize}
.weather-loc{font-size:12px;color:var(--text-hint);margin-top:2px}
.weather-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.weather-detail{background:var(--bg);border-radius:var(--radius-md);padding:8px 10px;text-align:center}
.weather-detail .wd-val{font-size:15px;font-weight:600;color:var(--text)}
.weather-detail .wd-lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
.incident-big{text-align:center;padding:20px 0 10px}
.incident-num{font-size:72px;font-weight:700;line-height:1;letter-spacing:-0.04em}
.incident-label{font-size:13px;color:var(--text-muted);margin-top:6px}
.incident-record{font-size:12px;color:var(--text-muted);margin-top:4px}
.topic-cat{margin-bottom:14px}
.topic-cat-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.topic-chips{display:flex;flex-wrap:wrap;gap:6px}
.topic-chip{font-size:12px;padding:5px 12px;border:0.5px solid var(--border-mid);border-radius:20px;cursor:pointer;background:var(--bg);color:var(--text);font-family:inherit;transition:all 0.15s}
.topic-chip:hover{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text)}
.chart-outer{position:relative;padding-bottom:28px;margin-bottom:8px}
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:180px;position:relative}
.goal-line-h{position:absolute;left:0;right:0;border-top:2px dashed var(--red);pointer-events:none}
.goal-line-label{position:absolute;right:0;font-size:10px;color:var(--red);font-weight:600;background:var(--surface);padding:0 4px;margin-top:-9px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.bar-val-label{font-size:11px;font-weight:600;color:var(--text);margin-bottom:3px;min-height:16px;text-align:center}
.bar-body{width:85%;border-radius:6px 6px 0 0;transition:height 0.5s;min-height:2px}
.bar-day-label{font-size:11px;color:var(--text-muted);position:absolute;bottom:-22px;text-align:center;width:100%}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted)}
.legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
